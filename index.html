<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Permis LU</title>
</head>
<body>
    <div id="notification-banner"></div>
    <section id="flaggedSection"></section>
    <img id="dynamicImage" alt="Dynamic content" />

    <script>
        // Safely add an image to the DOM
        function addImage(src) {
            const img = document.createElement('img');
            img.src = src;
            document.getElementById('dynamicImage').appendChild(img);
        }

        // Safely set notification banner text
        function setNotification(text) {
            const banner = document.getElementById('notification-banner');
            banner.textContent = text;
        }

        // Safely handle flagged section
        function displayFlaggedContent(content) {
            const flaggedSection = document.getElementById('flaggedSection');
            flaggedSection.innerHTML = ''; // Clear previous content
            const newContent = document.createElement('div');
            newContent.textContent = content;
            flaggedSection.appendChild(newContent);
        }

        // Update data in sessionStorage selectively
        function updateSessionStorage(key, value) {
            if (sessionStorage.getItem(key)) {
                sessionStorage.setItem(key, value);
            }
        }

        // Use event listener for DOMContentLoaded
        document.addEventListener('DOMContentLoaded', function() {
            // Your initialization code here.
            addImage('path/to/image.jpg');
            setNotification('Welcome to Quiz Permis LU!');
            displayFlaggedContent('This is flagged content.');
        });
    </script>
</body>
</html>
